<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deri Kanseri Risk Analizi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        .risk-bar { height: 20px; border-radius: 10px; overflow: hidden; background: #e9ecef; }
        .risk-fill { height: 100%; border-radius: 10px; transition: width 0.5s ease; }
    </style>
</head>
<body class="bg-light">
<div class="container py-4">
    <h2 class="mb-4 text-center">🧠 Deri Kanseri Risk Analizi</h2>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST" enctype="multipart/form-data" class="mb-4">
        <div class="mb-3">
            <label for="file" class="form-label">📸 Deri Fotoğrafı Yükle</label>
            <input type="file" class="form-control" id="file" name="file" accept="image/*" required />
        </div>

        <div class="mb-3">
            <label for="age" class="form-label">🎂 Yaş</label>
            <input type="number" class="form-control" id="age" name="age" min="1" max="120" value="{{ age or 30 }}" required />
        </div>

        <div class="mb-3">
            <label for="skin_type" class="form-label">☀️ Cilt Tipi (Fitzpatrick)</label>
            <select class="form-select" id="skin_type" name="skin_type" required>
                <option value="1" {% if skin_type == '1' %}selected{% endif %}>Tip I - Çok Açık Ten, Her Zaman Yanar</option>
                <option value="2" {% if skin_type == '2' %}selected{% endif %}>Tip II - Açık Ten, Kolayca Yanar</option>
                <option value="3" {% if skin_type == '3' %}selected{% endif %}>Tip III - Buğday Ten, Bazen Yanar</option>
                <option value="4" {% if skin_type == '4' %}selected{% endif %}>Tip IV - Esmer Ten, Nadiren Yanar</option>
                <option value="5" {% if skin_type == '5' %}selected{% endif %}>Tip V - Koyu Esmer, Nadiren Yanar</option>
                <option value="6" {% if skin_type == '6' %}selected{% endif %}>Tip VI - Çok Koyu Ten, Hiç Yanmaz</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">👨‍👩‍👧 Ailede Cilt Kanseri Öyküsü</label>
            <div>
                <input type="radio" id="family_no" name="family_history" value="no" {% if family_history != 'yes' %}checked{% endif %} />
                <label for="family_no">Hayır</label>
                <input type="radio" id="family_yes" name="family_history" value="yes" {% if family_history == 'yes' %}checked{% endif %} />
                <label for="family_yes">Evet</label>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">⚠️ Ek Risk Faktörleri</label>
            <div>
                <input type="checkbox" id="sun_exposure" name="additional_risks" value="sun_exposure" {% if 'sun_exposure' in additional_risks %}checked{% endif %} />
                <label for="sun_exposure">Yoğun güneş maruziyeti</label><br/>
                <input type="checkbox" id="outdoor_work" name="additional_risks" value="outdoor_work" {% if 'outdoor_work' in additional_risks %}checked{% endif %} />
                <label for="outdoor_work">Açık havada çalışma</label><br/>
                <input type="checkbox" id="solarium" name="additional_risks" value="solarium" {% if 'solarium' in additional_risks %}checked{% endif %} />
                <label for="solarium">Solaryum kullanımı</label>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100">🔍 Analiz Et</button>
    </form>

    {% if prediction %}
    <div class="card p-3 shadow-sm">
        <h4>📊 Sonuçlar</h4>
        <p><strong>🧠 Tahmin:</strong> {{ prediction }}</p>
        <p><strong>📈 Model Güveni:</strong> %{{ confidence }}</p>
        <p><strong>🔢 Risk Skoru:</strong> {{ risk_score }}/100</p>
        <div class="risk-bar mb-3">
            <div class="risk-fill bg-{{ risk_color }}" style="width: {{ risk_score }}%;"></div>
        </div>
        <p><strong>🏷️ Kategori:</strong> <span class="badge bg-{{ risk_color }}">{{ risk_category }}</span></p>
        <p><strong>💡 Öneri:</strong> {{ advice }}</p>
        <div>
            <img src="data:image/jpeg;base64,{{ image_data }}" alt="Yüklenen Fotoğraf" class="img-fluid rounded" style="max-height: 300px;" />
        </div>
    </div>
    {% endif %}
</div>
</body>
</html>
