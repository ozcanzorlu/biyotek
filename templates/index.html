<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Cilt Kanseri Tahmin Sistemi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="card shadow-lg">
            <div class="card-body text-center">
                <h1 class="mb-4 text-primary">🩺 Cilt Kanseri Tahmin Sistemi</h1>

                <!-- Form -->
                <form method="POST" enctype="multipart/form-data" class="mb-4">
                    <div class="input-group mb-3">
                        <input type="file" name="file" class="form-control" required>
                        <button type="submit" class="btn btn-success">Tahmin Et</button>
                    </div>
                </form>

                <!-- Sonuç -->
                {% if prediction %}
                <div class="alert alert-info">
                    <h4>Tahmin: {{ prediction }}</h4>
                    {% if confidence %}
                    <p>Güven Oranı: {{ confidence }}%</p>
                    {% endif %}
                </div>

                <!-- Görsel -->
                {% if img_path %}
                <div class="mt-3">
                    <h5>Yüklenen Görsel:</h5>
                    <img src="{{ img_path }}" alt="Yüklenen Görsel" class="img-thumbnail" width="250">
                </div>
                {% endif %}
                {% endif %}
            </div>
        </div>
    </div>

</body>
</html>
