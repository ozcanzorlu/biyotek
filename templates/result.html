<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Tahmin Sonucu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="card shadow-lg text-center">
            <div class="card-body">
                <h1 class="text-success mb-4">🩺 Tahmin Sonucu</h1>

                <!-- Tahmin bilgisi -->
                <div class="alert alert-info">
                    <h4 class="alert-heading">Sonuç:</h4>
                    <p class="mb-1"><b>{{ prediction }}</b></p>
                </div>

                <!-- Yüklenen görüntü (opsiyonel) -->
                {% if img_path %}
                <div class="mt-3">
                    <h5>Analiz Edilen Görsel:</h5>
                    <img src="{{ img_path }}" alt="Yüklenen Görsel" class="img-thumbnail" width="300">
                </div>
                {% endif %}

                <!-- Ana sayfaya dönüş -->
                <div class="mt-4">
                    <a href="/" class="btn btn-primary">← Ana Sayfaya Dön</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
